<!doctype html>
<!-- Formula T GUI (given code, not part of the assignment). Served by gui/serve.py.
     PENDING: the instructor will rework this interface; treat the look as a placeholder. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula T</title>
<style>
  :root { --bg: #15171c; --panel: #1f2229; --fg: #e8e8e8; --dim: #8a8f99; --red: #e10600; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panel); }
  header h1 { font-size: 18px; margin: 0 16px 0 0; }
  button, select { background: #2c3039; color: var(--fg); border: 1px solid #444; border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button.active { border-color: var(--fg); }
  button.flag { background: var(--red); border-color: var(--red); font-weight: bold; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  canvas { width: 100%; background: var(--panel); border-radius: 6px; }
  #controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  #message { color: var(--dim); margin-top: 8px; min-height: 1.4em; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 6px; }
  th, td { padding: 4px 8px; text-align: left; white-space: nowrap; }
  th { color: var(--dim); font-weight: normal; border-bottom: 1px solid #333; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .out { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Formula T</h1>
  <button id="tab-qualifying" class="active">Repetición de la clasificación</button>
  <button id="tab-live">Carrera en vivo</button>
</header>
<main>
  <section>
    <canvas id="track" width="1000" height="560"></canvas>
    <div id="controls"></div>
    <div id="message"></div>
  </section>
  <section><table id="tower"></table></section>
</main>
<script src="app.js"></script>
</body>
</html>
